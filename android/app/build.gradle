plugins { id 'com.android.application' }
def signing = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) { signingFile.withInputStream { signing.load(it) } }
android {
    namespace 'io.github.root0323.astrosky'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.root0323.astrosky'
        minSdk 26
        targetSdk 35
        versionCode 801
        versionName '0.8.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (signingFile.exists()) { publication { storeFile rootProject.file(signing['storeFile']); storePassword signing['storePassword']; keyAlias signing['keyAlias']; keyPassword signing['keyPassword'] } }
    }
    buildTypes { release { minifyEnabled false; if (signingFile.exists()) signingConfig signingConfigs.publication } }
    androidResources { noCompress += ['wasm', 'whl', 'zip'] }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
